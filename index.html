<!doctype html>
<html lang="sk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101014" />
    <script>
      try { document.documentElement.dataset.theme = localStorage.getItem('osud-theme') === 'light' ? 'light' : 'dark'; }
      catch { document.documentElement.dataset.theme = 'dark'; }
      try { const skin=localStorage.getItem('osud-skin'); document.documentElement.dataset.skin=['studio','retro','minimal','playful'].includes(skin) ? skin : 'studio'; }
      catch { document.documentElement.dataset.skin='studio'; }
    </script>
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/icons/icon-180.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Osud">
    <meta name="description" content="Nevieš sa rozhodnúť? Pridaj možnosti, roztoč valce a nechaj osud vybrať." />
    <title>Osud rozhodol — tvoj automat na dilemy</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23c5f277'/%3E%3Ctext x='32' y='46' text-anchor='middle' font-size='45'%3E✳%3C/text%3E%3C/svg%3E" />
  </head>
  <body><div id="app"></div><script type="module" src="/src/main.ts"></script></body>
</html>
