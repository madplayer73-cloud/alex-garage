name: osud
services:
  osud:
    image: osud-rozhodol:local
    build:
      context: .
    restart: unless-stopped
    depends_on:
      photos:
        condition: service_healthy
    ports:
      - host_ip: "${OSUD_BIND_IP:-0.0.0.0}"
        target: 80
        published: "${OSUD_PORT:-8099}"
        protocol: tcp
    healthcheck:
      test: ["CMD", "wget", "-Y", "off", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
    x-casaos:
      ports:
        - container: "80"
          description:
            en_us: Web interface
            sk_sk: Webové rozhranie

  photos:
    stop_grace_period: 60s
    image: osud-photos:local
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/photos/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
    volumes:
      - "${OSUD_PHOTO_DIR:-/DATA/AppData/osud-photos}:/data"

x-casaos:
  main: osud
  category: Utilities
  port_map: "8099"
  scheme: http
  index: /
  title:
    en_us: Osud rozhodol
    sk_sk: Osud rozhodol
  description:
    en_us: A playful decision machine. Three spins, one verdict.
    sk_sk: Automat na každodenné dilemy. Tri pokusy, jeden verdikt.
