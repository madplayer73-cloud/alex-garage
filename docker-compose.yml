name: osud
services:
  osud:
    image: osud-rozhodol:local
    build:
      context: .
    restart: unless-stopped
    ports:
      - target: 80
        published: "${OSUD_PORT:-8099}"
        protocol: tcp
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
    x-casaos:
      ports:
        - container: "80"
          description:
            en_us: Web interface
            sk_sk: Webové rozhranie

x-casaos:
  main: osud
  category: Utilities
  port_map: "8099"
  scheme: http
  index: /
  title:
    en_us: Osud rozhodol
    sk_sk: Osud rozhodol
  description:
    en_us: A playful decision machine. Three spins, one verdict.
    sk_sk: Automat na každodenné dilemy. Tri pokusy, jeden verdikt.
